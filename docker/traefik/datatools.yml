http:
  routers:
    datatools-ui:
      rule: 'Host(`datatools.example.org`)'
      entryPoints:
        - websecure
      priority: 10
      service: datatools-ui@docker
      tls: {}
    datatools-api:
      rule: 'Host(`datatools.example.org`) && (Path(`/api`) || PathPrefix(`/api/`))'
      entryPoints:
        - websecure
      priority: 20
      service: datatools-api@docker
      tls: {}
