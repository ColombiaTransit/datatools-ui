version: "3.8"

x-datatools-server-image: &datatools-server-image "${DATATOOLS_SERVER_IMAGE:-ghcr.io/colombiatransit/datatools-server:dev}"

x-datatools-ui-image: &datatools-ui-image "${DATATOOLS_UI_IMAGE:-ghcr.io/colombiatransit/datatools-ui:dev}"

x-common-variables: &common-variables
  BUGSNAG_KEY: "${BUGSNAG_KEY}"
  S3_BUCKET: "${S3_BUCKET}"
  LOGS_S3_BUCKET: "${LOGS_S3_BUCKET}"
  MS_TEAMS_WEBHOOK_URL: "${MS_TEAMS_WEBHOOK_URL}"
  MAPBOX_ACCESS_TOKEN: "${MAPBOX_ACCESS_TOKEN}"
  GITHUB_SHA: "${GITHUB_SHA}"
  GITHUB_REF_SLUG: "${GITHUB_REF_SLUG}"
  TRANSITFEEDS_KEY: "${TRANSITFEEDS_KEY}"
  GITHUB_REPOSITORY: "${GITHUB_REPOSITORY}"
  GITHUB_WORKSPACE: "${GITHUB_WORKSPACE}"
  GITHUB_RUN_ID: "${GITHUB_RUN_ID}"
  AUTH0_CLIENT_ID: "${AUTH0_CLIENT_ID}"
  AUTH0_PUBLIC_KEY: "${AUTH0_PUBLIC_KEY}"
  AUTH0_CONNECTION_NAME: "${AUTH0_CONNECTION_NAME}"
  AUTH0_DOMAIN: "${AUTH0_DOMAIN}"
  AUTH0_API_CLIENT: "${AUTH0_API_CLIENT}"
  AUTH0_API_SECRET: "${AUTH0_API_SECRET}"
  OSM_VEX: "${OSM_VEX}"
  SPARKPOST_KEY: "${SPARKPOST_KEY}"
  SPARKPOST_EMAIL: "${SPARKPOST_EMAIL}"
  GTFS_DATABASE_URL: "jdbc:postgresql://postgres/dmtest"
  GTFS_DATABASE_USER: "root"
  GTFS_DATABASE_PASSWORD: "e2e"
  MONGO_DB_NAME: "data_manager"
  MONGO_HOST: "mongo:27017"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_REGION: "${AWS_REGION}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  DISABLE_AUTH: "true"

services:
  datatools-config:
    image: *datatools-ui-image
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for file in env.yml server.yml; do
          if [ -f "/config/$$file" ]; then
            continue
          fi
          source="/datatools-build/docker/server/$$file"
          if [ ! -f "$$source" ]; then
            echo "Missing configuration template: $$source" >&2
            exit 1
          fi
          cp "$$source" "/config/$$file"
        done
    network_mode: none
    volumes:
      - dt-server-config:/config
  datatools-server:
    image: *datatools-server-image
    restart: always
    environment:
      <<: *common-variables
      DISABLE_AUTH: "false"
      OIDC_ENABLED: "true"
      OIDC_ISSUER: "${OIDC_ISSUER:?Set the Keycloak issuer in Portainer}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-datatools}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?Set the Keycloak client secret in Portainer}"
      OIDC_ADMIN_SUBJECT: "${OIDC_ADMIN_SUBJECT:-}"
    depends_on:
      datatools-config:
        condition: service_completed_successfully
    volumes:
      - dt-server-config:/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.services.datatools-api.loadbalancer.server.port=4000"
    networks:
      - default
      - database
      - traefik
  datatools-ui:
    image: *datatools-ui-image
    restart: always
    environment: *common-variables
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.services.datatools-ui.loadbalancer.server.port=9966"
    networks:
      - default
      - traefik
  mongo:
    image: mongo:8.0
    restart: always
    volumes:
      - dt-mongo:/data/db
    networks:
      - database
  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: root
      POSTGRES_PASS: e2e
      POSTGRES_DB: dmtest
    image: postgres:17
    restart: always
    volumes:
      - dt-postgres:/var/lib/postgresql/data
    networks:
      - database
networks:
  database:
    internal: true
  traefik:
    name: "traefik_default"
    external: true
volumes:
  dt-server-config:
  dt-postgres:
  dt-mongo:
