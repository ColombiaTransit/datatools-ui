services:
  datatools-ui:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.services.datatools-ui.loadbalancer.server.port=9966"
    networks:
      - default
      - traefik
  datatools-server:
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.services.datatools-api.loadbalancer.server.port=4000"
    networks:
      - traefik
networks:
  traefik:
    name: "${TRAEFIK_NETWORK:-traefik}"
    external: true
